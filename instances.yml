# Instances de démonstration de Vigilo.
#
# Chaque entrée crée une instance complète (base de données, backend, application web) accessible sur
#   https://<id>.vigilo-demo.velocite-montpellier.fr/webapp/  (application web)
#   https://<id>.vigilo-demo.velocite-montpellier.fr/admin/   (administration)
#
# Ajouter ou retirer une entrée suffit : le serveur applique la liste en une minute environ après la fusion sur main.
# Une instance retirée est arrêtée mais ses données sont gardées : la remettre dans la liste la redémarre telle quelle.
#
# Champs :
#   id           obligatoire : lettres, chiffres et tirets (32 caractères au plus), sert de sous-domaine (en minuscules)
#   description  facultatif : pour qui, pourquoi
#   backend      facultatif : version de l'image vigilobs/vigilo-backend (défaut : 0.0, dernière 0.0.x publiée)
#   webapp       facultatif : version de l'image ghcr.io/jesuisundesdeux/vigilo-webapp (défaut : latest ; edge = master)
instances:
  - id: Millau-Grands-Causses
    description: Millau Grands Causses
  - id: Metz-Metropole
    description: Metz Métropole
  - id: bfc-creusot
    description: BFC Creusot

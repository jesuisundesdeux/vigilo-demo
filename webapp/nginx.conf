# nginx of the web app container of each demo (mounted over the image's default.conf):
#   /          -> /webapp/
#   /webapp/   -> the web app, with config.json pointing at /conf
#   /conf/     -> citylist.json and categorielist.json of this demo (written by the controller)
# Everything else of the host (API, /admin/) goes to the backend (Traefik rules).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = / {
        return 302 /webapp/$is_args$args;
    }
    location = /webapp {
        return 301 /webapp/$is_args$args;
    }
    location = /webapp/config.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        return 200 '{"conf_url": "/conf"}';
    }
    location = /webapp/index.html {
        rewrite ^ /index.html break;
        add_header Cache-Control "no-cache";
    }
    location /webapp/ {
        rewrite ^/webapp/(.*)$ /$1 break;
        add_header Cache-Control "no-cache";
        location ~* \.(js|css|woff2?|ttf|eot|png|jpe?g|gif|svgz?)$ {
            rewrite ^/webapp/(.*)$ /$1 break;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
    location /conf/ {
        alias /srv/conf/;
        default_type application/json;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }
}
